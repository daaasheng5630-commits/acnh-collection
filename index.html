<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>南半球 島のコレクション</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f3e5;color:#34483c;font:16px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:22px}header{background:#dcebd4;border-radius:28px;padding:26px}h1{margin:0;font-size:28px}button,input,select{font:inherit;padding:10px;border:1px solid #b9cbb6;border-radius:12px;background:white;color:inherit}button{cursor:pointer}button.active{background:#39765b;color:white}nav,.tools{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:20px 0}.stat,article{background:white;border-radius:16px;padding:15px}progress{width:100%;accent-color:#57936c}#items{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}article label{display:block;margin-top:8px}input[type=checkbox]{accent-color:#39765b;width:19px;height:19px;vertical-align:middle}small{color:#65786a}article.done{background:#e4efdc}footer{margin:24px 0}a{color:#39765b}</style><main><header><small>ANIMAL CROSSING · SOUTHERN HEMISPHERE</small><h1>🌴 島のコレクション手帳</h1><p>南半球の図鑑コンプリートを目指そう！</p><span id="month"></span></header><div class="stats" id="stats"></div><nav id="nav"></nav><div class="tools"><input id="q" placeholder="名前で検索"><select id="filter"><option value="all">すべて</option><option value="missing">未入手・未確認</option><option value="done">入手済み</option><option value="donated">寄贈済み</option></select></div><p id="count"></p><div id="items"></div><footer><button id="export">記録をバックアップ</button> <button onclick="document.getElementById('import').click()">記録を復元</button><input type="file" id="import" accept=".json" hidden><p><small>記録はこのブラウザに保存されます。別端末への移行にはバックアップを使ってください。出現時期・時間は <a href="https://game8.jp/atsumare-doubutsunomori">攻略情報</a> で南半球を確認してください。</small></p></footer></main><script>
const data={魚:'タナゴ,オイカワ,フナ,ウグイ,コイ,ニシキゴイ,キンギョ,デメキン,ランチュウ,メダカ,ザリガニ,スッポン,カミツキガメ,オタマジャクシ,カエル,ドンコ,ドジョウ,ナマズ,ライギョ,ブルーギル,イエローパーチ,ブラックバス,ティラピア,パイク,ワカサギ,アユ,ヤマメ,オオイワナ,ゴールデントラウト,イトウ,サケ,キングサーモン,シャンハイガニ,グッピー,ドクターフィッシュ,エンゼルフィッシュ,ベタ,ネオンテトラ,レインボーフィッシュ,ピラニア,アロワナ,ドラド,ガー,ピラルク,エンドリケリー,チョウザメ,クリオネ,タツノオトシゴ,クマノミ,ナンヨウハギ,チョウチョウウオ,ナポレオンフィッシュ,ミノカサゴ,フグ,ハリセンボン,アンチョビ,アジ,イシダイ,スズキ,タイ,カレイ,ヒラメ,イカ,ウツボ,ハナヒゲウツボ,マグロ,カジキ,ロウニンアジ,シイラ,マンボウ,エイ,ノコギリザメ,シュモクザメ,サメ,ジンベエザメ,コバンザメ,チョウチンアンコウ,リュウグウノツカイ,デメニギス,シーラカンス',虫:'モンシロチョウ,モンキチョウ,アゲハチョウ,カラスアゲハ,アオスジアゲハ,オオゴマダラ,オオムラサキ,オオカバマダラ,モルフォチョウ,ミイロタテハ,アカエリトリバネアゲハ,アレキサンドラトリバネアゲハ,ガ,ヨナグニサン,ニシキオオツバメガ,ショウリョウバッタ,トノサマバッタ,イナゴ,キリギリス,コオロギ,スズムシ,カマキリ,ハナカマキリ,ミツバチ,ハチ,アブラゼミ,ミンミンゼミ,クマゼミ,ツクツクホウシ,ヒグラシ,セミのぬけがら,アキアカネ,ギンヤンマ,オニヤンマ,イトトンボ,ホタル,オケラ,アメンボ,ゲンゴロウ,タガメ,カメムシ,ジンメンカメムシ,テントウムシ,ハンミョウ,タマムシ,バイオリンムシ,ゴマダラカミキリ,ルリボシカミキリ,ホウセキゾウムシ,フンコロガシ,オオセンチコガネ,プラチナコガネ,カナブン,ゴライアスオオツノハナムグリ,ノコギリクワガタ,ミヤマクワガタ,オオクワガタ,ニジイロクワガタ,ホソアカクワガタ,オウゴンオニクワガタ,ギラファノコギリクワガタ,カブトムシ,コーカサスオオカブト,ゾウカブト,ヘラクレスオオカブト,ナナフシ,コノハムシ,ミノムシ,アリ,ヤドカリ,フナムシ,ハエ,カ,ノミ,カタツムリ,ダンゴムシ,ムカデ,クモ,タランチュラ,サソリ',海の幸:'ワカメ,ウミブドウ,ナマコ,センジュナマコ,ヒトデ,ウニ,パイプウニ,イソギンチャク,ミズクラゲ,ウミウシ,アコヤガイ,ムールガイ,オイスター,ホタテ,バイガイ,サザエ,アワビ,オオシャコガイ,オウムガイ,タコ,メンダコ,コウモリダコ,ホタルイカ,ガザミ,ダンジネスクラブ,ズワイガニ,タラバガニ,フジツボ,タカアシガニ,クルマエビ,アマエビ,シャコ,イセエビ,ロブスター,ダイオウグソクムシ,カブトガニ,チンアナゴ,ヒラムシ,カイロウドウケツ,ホヤ',はにわ:'アゲはにわ,アルペンはにわ,ウワーはにわ,オエッはにわ,カクはにわ,カタカタはにわ,カラカラはにわ,キュルはにわ,クシャはにわ,コロンはにわ,シェイクはにわ,ジャラはにわ,シュポはにわ,スイングはにわ,スパイクはにわ,ズボはにわ,ドスドスはにわ,ドラムはにわ,トレモロはにわ,パタパタはにわ,ピープーはにわ,ピコピコはにわ,ヒュルルはにわ,ブーンはにわ,ブクブクはにわ,フニャはにわ,フワフワはにわ,ペコペコはにわ,ポコポコはにわ,ポッピンはにわ,ポワはにわ,マスターはにわ,メロディはにわ,モコはにわ,ユラユラはにわ,ワンワンはにわ'};for(const k in data)data[k]=data[k].split(',');let state={};try{state=JSON.parse(localStorage.getItem('island-collection-v1')||'{}')}catch{}let cat='魚';const $=id=>document.getElementById(id);const icons={魚:'🎣',虫:'🦋',海の幸:'🐚',はにわ:'🪇'};function save(){localStorage.setItem('island-collection-v1',JSON.stringify(state))}function render(){ $('month').textContent='📅 '+(new Date().getMonth()+1)+'月 · 南半球';$('stats').innerHTML=Object.keys(data).map(k=>{let n=data[k].filter(x=>state[k+x]?.got).length;return `<div class="stat">${icons[k]} ${k}<h2>${n} / ${data[k].length}</h2><progress value="${n}" max="${data[k].length}"></progress></div>`}).join('');$('nav').innerHTML=Object.keys(data).map(k=>`<button class="${k===cat?'active':''}" data-cat="${k}">${icons[k]} ${k}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()});let f=$('filter').value;let list=data[cat].filter(x=>x.includes($('q').value)&& (f==='all'||(f==='done'&&state[cat+x]?.got)||(f==='missing'&&!state[cat+x]?.got)||(f==='donated'&&state[cat+x]?.donated)));$('count').textContent=list.length+'種類';$('items').replaceChildren();for(const x of list){let key=cat+x,s=state[key]||{},a=document.createElement('article');a.className=s.got?'done':'';let title=document.createElement('strong');title.textContent=x;a.append(title);for(const [field,label] of [['got','入手済み'],...(cat==='はにわ'?[]:[['donated','寄贈済み']])]){let l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=!!s[field];c.onchange=()=>{state[key]={...s,[field]:c.checked};if(field==='donated'&&c.checked)state[key].got=true;if(field==='got'&&!c.checked)state[key].donated=false;if(state[key].got&&!state[key].date)state[key].date=new Date().toLocaleDateString('ja-JP');save();render()};l.append(c,' '+label);a.append(l)}let note=document.createElement('input');note.placeholder=cat==='はにわ'?'色・メモ':'メモ';note.style.width='100%';note.style.marginTop='10px';note.value=s.note||'';note.onchange=()=>{state[key]={...state[key],note:note.value};save()};a.append(note);if(s.got&&s.date){let d=document.createElement('small');d.textContent='入手日 '+s.date;a.append(d)}$('items').append(a)}}$('q').oninput=render;$('filter').onchange=render;$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='island-collection.json';a.click()};$('import').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!v||typeof v!=='object'||Array.isArray(v))throw Error();if(confirm('現在の記録をバックアップの内容で置き換えますか？')){state=v;save();render()}}catch{alert('バックアップを読み込めませんでした')}};render();</script></html>
